name: 开发版 Box64 (aarch64)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

env:
  SRC_REPO: https://github.com/ptitSeb/box64
  LAST_DEV_COMMIT_FILE: last_dev_box64_commit.txt
  # Android W^X (mprotect) 修复：1 = 补丁必须成功应用，否则终止构建；0 = 应用失败也继续（应急开关）
  ANDROID_WX_PATCH_STRICT: "1"
  FEX_LLVMMINGW_TAG: "20250920"
  FEX_LLVMMINGW_NAME: "llvm-mingw-20250920-ucrt-ubuntu-22.04-aarch64"
  # 只有「ARM 相关」的上游提交才触发自动构建，避免无关改动（如 RISC-V/LoongArch
  # 后端、文档）也每 30 分钟构建一次。
  #
  # 判定方式（保守、不漏报）：从上次构建的提交到 HEAD 之间逐个检查提交所改的文件，
  # 只要有任何文件 **不属于** 下列「其它架构专属」路径，就认为是 ARM 相关 → 构建。
  # 宁可多构建几次，也不放过 ARM64 / ARM64EC / WOW64 / 通用代码 的真实修复。
  #
  # 被忽略的路径（正则，前缀匹配，用 | 分隔）：
  IGNORE_PATHS: '^src/dynarec/(rv64|la64|ppc64le)/'
  # 最多回溯检查多少个提交（防止上次构建太久远导致 API 调用过多）
  MAX_COMMITS_SCAN: "60"

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential gcc git patchelf jq curl unzip \
            clang lld llvm ninja-build wget tar xz-utils

      - name: 安装 llvm-mingw (bylaws fork, 含 arm64ec)
        run: |
          cd /tmp
          wget -q --show-progress \
            "https://github.com/bylaws/llvm-mingw/releases/download/${FEX_LLVMMINGW_TAG}/${FEX_LLVMMINGW_NAME}.tar.xz"
          tar -xJf "${FEX_LLVMMINGW_NAME}.tar.xz"
          rm -f "${FEX_LLVMMINGW_NAME}.tar.xz"

          DIR="${FEX_LLVMMINGW_NAME}"
          echo "解压目录: /tmp/${DIR}"

          echo "/tmp/${DIR}/bin" >> $GITHUB_PATH
          export PATH="/tmp/${DIR}/bin:${PATH}"

          echo "=== FEX 交叉工具链检查 ==="
          MISSING=0
          for T in \
            arm64ec-w64-mingw32-clang \
            arm64ec-w64-mingw32-clang++ \
            arm64ec-w64-mingw32-dlltool \
            aarch64-w64-mingw32-clang \
            aarch64-w64-mingw32-clang++ \
            aarch64-w64-mingw32-dlltool
          do
            if command -v "$T" >/dev/null 2>&1; then
              printf '✅ %-38s %s\n' "$T" "$(command -v "$T")"
            else
              printf '❌ %-38s MISSING\n' "$T"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || { echo "❌ 交叉工具链不完整"; exit 1; }

      - name: 获取最新提交信息
        id: get_info
        run: |
          LATEST_COMMIT_FULL=$(git ls-remote ${{ env.SRC_REPO }} HEAD | awk '{print $1}')
          LATEST_COMMIT_SHORT=${LATEST_COMMIT_FULL:0:8}

          curl -s "https://api.github.com/repos/ptitSeb/box64/commits/$LATEST_COMMIT_FULL" -o commit.json
          COMMIT_DATE=$(jq -r '.commit.author.date' commit.json | cut -d'T' -f1)
          COMMIT_AUTHOR=$(jq -r '.commit.author.name' commit.json)
          COMMIT_MESSAGE=$(jq -r '.commit.message' commit.json | head -n1)

          CURRENT_DATE=$(date +%Y%m%d%H%M)
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # ===== 版本号：读 box64 源码的 box64version.h（与上游 release.yml 同源）=====
          # 包名带真实语义版本（如 v0.4.5），而不是时间戳。
          # 用 GitHub API 读，避免为了一个头文件提前 clone。
          BOX64_VERSION=""
          VH_JSON=$(mktemp)
          if curl -fsSL "https://api.github.com/repos/ptitSeb/box64/contents/src/box64version.h?ref=${LATEST_COMMIT_FULL}" -o "$VH_JSON"; then
            VH_TEXT=$(jq -r '.content' "$VH_JSON" 2>/dev/null | base64 -d 2>/dev/null || true)
            V_MAJOR=$(printf '%s\n' "$VH_TEXT" | grep -m1 'BOX64_MAJOR'    | awk '{print $3}')
            V_MINOR=$(printf '%s\n' "$VH_TEXT" | grep -m1 'BOX64_MINOR'    | awk '{print $3}')
            V_REV=$(  printf '%s\n' "$VH_TEXT" | grep -m1 'BOX64_REVISION' | awk '{print $3}')
            if [ -n "$V_MAJOR" ] && [ -n "$V_MINOR" ] && [ -n "$V_REV" ]; then
              BOX64_VERSION="v${V_MAJOR}.${V_MINOR}.${V_REV}"
            fi
          fi
          rm -f "$VH_JSON"
          if [ -z "$BOX64_VERSION" ]; then
            echo "⚠️ 未能从 box64version.h 读到版本号，回退 v0.0.0（构建继续，包名版本号不可信）"
            BOX64_VERSION="v0.0.0"
          fi

          # 同版本可能多次构建，用 时间戳+短commit 保证唯一（tag 不冲突）
          BUILD_ID="${CURRENT_DATE:-$(date +%Y%m%d%H%M)}-${LATEST_COMMIT_SHORT}"
          VERSION="${BOX64_VERSION}-${BUILD_ID}"

          echo "BOX64_VERSION=$BOX64_VERSION" >> $GITHUB_ENV
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "LATEST_COMMIT=$LATEST_COMMIT_FULL" >> $GITHUB_ENV
          echo "LATEST_COMMIT_SHORT=$LATEST_COMMIT_SHORT" >> $GITHUB_ENV
          echo "COMMIT_DATE=$COMMIT_DATE" >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV

          echo "📊 构建信息:"
          echo "   box64 版本: $BOX64_VERSION"
          echo "   完整版本: $VERSION"
          echo "   提交: $LATEST_COMMIT_SHORT"
          echo "   作者: $COMMIT_AUTHOR"
          echo "   日期: $COMMIT_DATE"

      - name: 获取上次构建信息
        id: get_last
        run: |
          if [ -f "${{ env.LAST_DEV_COMMIT_FILE }}" ]; then
            LAST_BUILD=$(cat "${{ env.LAST_DEV_COMMIT_FILE }}")
            echo "👉 上次构建提交: ${LAST_BUILD:0:8}"
            echo "last_build=$LAST_BUILD" >> $GITHUB_OUTPUT
          else
            echo "👉 首次构建，无历史记录"
            echo "last_build=none" >> $GITHUB_OUTPUT
          fi

      - name: 检查是否需要构建
        id: check_build
        run: |
          LAST_BUILD="${{ steps.get_last.outputs.last_build }}"
          CURRENT_COMMIT="${{ env.LATEST_COMMIT }}"

          if [ "$CURRENT_COMMIT" = "$LAST_BUILD" ]; then
            echo "✅ 无新提交，跳过构建"
            echo "skip_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ============ 只在「ARM 相关」改动时才构建 ============
          # 逐个检查 last_build..HEAD 的提交；只要有一个提交改了
          # 非「其它架构专属」路径的文件，就判定为 ARM 相关。
          IGNORE_RE='${{ env.IGNORE_PATHS }}'
          MAX_SCAN=${{ env.MAX_COMMITS_SCAN }}
          API="https://api.github.com/repos/ptitSeb/box64"

          # 首次构建（无历史记录）直接构建，无需比较区间
          if [ "$LAST_BUILD" = "none" ] || [ -z "$LAST_BUILD" ]; then
            echo "🟢 首次构建（无历史记录），直接构建"
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "arm_reason=first-build" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔍 检查 ${LAST_BUILD:0:8} .. ${CURRENT_COMMIT:0:8} 之间的改动..."

          # 用 compare API 一次性拿到区间内的文件变化（优先，省调用）
          CMP_JSON=$(mktemp)
          FILES_TXT=$(mktemp)
          ARM_FOUND=false
          REASON=""

          if curl -fsSL -H "Accept: application/vnd.github+json" \
               "$API/compare/${LAST_BUILD}...${CURRENT_COMMIT}" -o "$CMP_JSON"; then
            TOTAL_COMMITS=$(jq -r '.total_commits // 0' "$CMP_JSON" 2>/dev/null || echo 0)
            # compare 的 files 上限 250 个；超过时 jq 拿不全，回退到逐提交扫描
            FILE_COUNT=$(jq -r '.files | length' "$CMP_JSON" 2>/dev/null || echo 0)
            jq -r '.files[]?.filename' "$CMP_JSON" > "$FILES_TXT" 2>/dev/null || true

            if [ "$TOTAL_COMMITS" -gt 300 ]; then
              echo "⚠️ 区间内有 $TOTAL_COMMITS 个提交（compare 上限 300），回退逐提交扫描"
              : > "$FILES_TXT"
            fi
          fi

          # 若 compare 没拿到文件（失败/超限），逐提交回退扫描
          if [ ! -s "$FILES_TXT" ]; then
            echo "ℹ️ compare 未返回文件列表，改为逐提交扫描（最多 $MAX_SCAN 个）"
            SCAN=0
            SHA="$CURRENT_COMMIT"
            while [ "$SCAN" -lt "$MAX_SCAN" ] && [ "$SHA" != "$LAST_BUILD" ] && [ -n "$SHA" ]; do
              CJ=$(mktemp)
              if curl -fsSL -H "Accept: application/vnd.github+json" "$API/commits/$SHA" -o "$CJ"; then
                jq -r '.files[]?.filename' "$CJ" >> "$FILES_TXT" 2>/dev/null || true
                NEXT=$(jq -r '.parents[0].sha // empty' "$CJ" 2>/dev/null || true)
                if [ -z "$NEXT" ]; then break; fi
                SHA="$NEXT"
              else
                echo "⚠️ 读取提交 $SHA 失败，保守起见判为需要构建"
                ARM_FOUND=true
                REASON="api-error-fail-open"
                break
              fi
              rm -f "$CJ"
              SCAN=$((SCAN+1))
            done
            echo "   已扫描 $SCAN 个提交"
          fi

          if [ "$ARM_FOUND" != "true" ]; then
            TOTAL_FILES=$(wc -l < "$FILES_TXT" 2>/dev/null | tr -d ' ' || echo 0)
            echo "   涉及 $TOTAL_FILES 个文件改动"

            # 过滤掉「其它架构专属」路径；只要还剩文件，就是 ARM 相关
            ARM_RELEVANT=$(grep -Ev "$IGNORE_RE" "$FILES_TXT" | grep -v '^$' | sort -u || true)

            if [ -n "$ARM_RELEVANT" ]; then
              ARM_FOUND=true
              REASON="arm-files"
              echo "   ✅ 检测到 ARM 相关文件改动："
              echo "$ARM_RELEVANT" | head -10 | sed 's/^/      /' || true
              MORE=$(( $(echo "$ARM_RELEVANT" | wc -l | tr -d ' ') - 10 )) || MORE=0
              if [ "$MORE" -gt 0 ]; then echo "      ... 还有 $MORE 个"; fi
            else
              echo "   ⏭️ 本次改动全部属于其它架构专属路径（被忽略），跳过构建"
            fi
          fi

          rm -f "$CMP_JSON" "$FILES_TXT"

          if [ "$ARM_FOUND" = "true" ]; then
            echo "🟢 需要构建（原因: $REASON）"
            echo "skip_build=false" >> $GITHUB_OUTPUT
            echo "arm_reason=$REASON" >> $GITHUB_OUTPUT
          else
            echo "✅ 无 ARM 相关改动，跳过构建"
            echo "skip_build=true" >> $GITHUB_OUTPUT
            echo "arm_reason=none" >> $GITHUB_OUTPUT
          fi

      - name: 克隆 Box64 并构建
        if: steps.check_build.outputs.skip_build == 'false'
        run: |
          which arm64ec-w64-mingw32-clang || { echo "❌ arm64ec 工具链未找到"; exit 1; }

          rm -rf box64
          git clone ${{ env.SRC_REPO }} box64
          cd box64

          unset LD_PRELOAD
          export GLIBC_PREFIX=/data/data/com.termux/files/usr/glibc
          export PATH=$GLIBC_PREFIX/bin:$PATH
          export LD_LIBRARY_PATH=$GLIBC_PREFIX/lib:$LD_LIBRARY_PATH

          sed -i 's|/usr|/data/data/com.termux/files/usr/glibc|g' CMakeLists.txt
          sed -i 's|/etc|/data/data/com.termux/files/usr/glibc/etc|g' CMakeLists.txt

          sed -i 's/(info->si_code == SEGV_ACCERR) \&\& ((prot\&~PROT_CUSTOM)==(PROT_READ|PROT_WRITE) || (prot\&~PROT_CUSTOM)==(PROT_READ|PROT_WRITE|PROT_EXEC)))/(info->si_code == SEGV_ACCERR) \&\& ((prot\&~PROT_CUSTOM)==(PROT_READ|PROT_WRITE) || (prot\&~PROT_CUSTOM)==(PROT_READ|PROT_WRITE|PROT_EXEC) || (prot\&~PROT_CUSTOM)==(PROT_READ|PROT_EXEC)))/' src/libtools/signals.c

          sed -i '/^        static uintptr_t old_addr = 0;$/a\        if((prot\&~PROT_CUSTOM)==(PROT_READ|PROT_EXEC)) {\n            uintptr_t page = (uintptr_t)addr \& ~(box64_pagesize-1);\n            if(mprotect((void*)page, box64_pagesize, PROT_READ|PROT_WRITE|PROT_EXEC)==0) {\n                setProtection(page, box64_pagesize, PROT_READ|PROT_WRITE|PROT_EXEC);\n                printf_log(LOG_DEBUG, "Force-added WRITE to r-x page %p (si_addr=%p)\\n", (void*)page, (void*)addr);\n                return;\n            }\n        }' src/libtools/signals.c

          sed -i '/^[[:space:]]*if(sig==5)[[:space:]]*{$/,/^[[:space:]]*}$/c\
          if(sig==5 || (sig == X64_SIGSEGV \&\& code == 0xbad0)) {\
            char prev[8 * 3];\
            char opcode[32 * 3];\
            FormatPeekBytes(emu, -8, 8, prev, sizeof(prev));\
            FormatPeekBytes(emu, 0, 32, opcode, sizeof(opcode));\
            printf_log(LOG_NONE,\
                "\\tBOX64 EXCEPTION: sig=%d code=0x%x RIP=%p CS=0x%04x\\n",\
                sig, code, (void*)R_RIP, emu->segs[_CS]);\
            printf_log(LOG_NONE,\
                "\\tOpcode [-8,+31]: %s | %s\\n",\
                prev, opcode);\
          }' src/os/emit_signals_linux.c

          sed -i '/^[[:space:]]*if(memcmp(sigcontext, &sigcontext_copy, sizeof(x64_ucontext_t)))/a\
          printf_log(LOG_INFO,\
            "BOX64 SIGNAL CHANGED: bad0=%d db=%p jmpbuf=%p RIP=%p RSP=%p skip=%d\\n",\
            (sig == X64_SIGSEGV && info->si_errno == 0xbad0),\
            db, emu->jmpbuf,\
            (void*)sigcontext->uc_mcontext.gregs[X64_RIP],\
            (void*)sigcontext->uc_mcontext.gregs[X64_RSP],\
            skip);' src/libtools/signals.c

          apply_patch() {
            patch -p1 -N -f < "$1" || true
            find . -name "*.rej" -delete 2>/dev/null || true
          }
          apply_patch "$GITHUB_WORKSPACE/compilefix.patch"
          apply_patch "$GITHUB_WORKSPACE/jmpbuf.patch"
          apply_patch "$GITHUB_WORKSPACE/opt.patch"
          apply_patch "$GITHUB_WORKSPACE/termux.patch"

          # ===== android-wx.patch：Android W^X (mprotect) 修复（默认启用）=====
          # 背景：targetSdkVersion >= 29 时，untrusted_app 域拒绝在 app 私有存储
          #       支撑的内存上做 mprotect(PROT_EXEC)，让 guest 的 mprotect() 直接失败。
          # 做法：只剥离传给“宿主 mprotect()”的 PROT_EXEC；box64 自身的保护记账
          #       （updateProtection / setGuestProtection）保持原样，所以 guest 可见的
          #       页属性、SMC / 写保护逻辑都不受影响（box64 从不原生执行 guest 页）。
          # 关闭：运行时 export BOX64_ANDROID_WX=0
          WX_PATCH="$GITHUB_WORKSPACE/android-wx.patch"
          if [ ! -f "$WX_PATCH" ]; then
            echo "❌ 找不到 $WX_PATCH"
            [ "${ANDROID_WX_PATCH_STRICT}" = "0" ] || exit 1
          elif patch -p1 --dry-run < "$WX_PATCH" >/dev/null 2>&1; then
            apply_patch "$WX_PATCH"
          else
            echo "⚠️ android-wx.patch 与当前上游不兼容（my_mprotect 上下文已变）"
            if [ "${ANDROID_WX_PATCH_STRICT}" = "0" ]; then
              echo "⚠️ ANDROID_WX_PATCH_STRICT=0，跳过该补丁继续构建"
            else
              echo "❌ 终止构建：开发版不允许静默失去 W^X 修复"
              exit 1
            fi
          fi

          if grep -q 'BOX64_HOST_MPROT' src/wrapped/wrappedlibc.c; then
            WX_N=$(grep -c 'BOX64_HOST_MPROT' src/wrapped/wrappedlibc.c)
            echo "✅ android-wx 已生效：宿主 mprotect 已剥离 PROT_EXEC（文件内 ${WX_N} 处引用 = 2 处宏定义 + 5 个调用点）"
          fi

          python3 "$GITHUB_WORKSPACE/fix_dfnone.py" || { echo "❌ dfnone 修复失败，终止构建"; exit 1; }

          mkdir -p build && cd build

          cmake .. \
            -DARM_DYNAREC=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DWINLATOR_GLIBC=ON \
            -DARM64=ON \
            -DSD8G2=ON \
            -DWOW64=ON

          make -j$(nproc)
          echo "✅ 构建完成"

          patchelf --set-interpreter /data/data/com.termux/files/usr/glibc/lib/ld-linux-aarch64.so.1 ./box64

          if [ -f "box64" ]; then
            echo "✅ 生成可执行文件: box64"
            file box64
            ls -lh box64
          else
            echo "❌ 未找到 box64 可执行文件"
            exit 1
          fi

          # ===== 收集所有产物 =====
          cd "$GITHUB_WORKSPACE"
          rm -rf dist && mkdir -p dist

          # 主可执行文件
          cp -a box64/build/box64 dist/

          # 所有 dll（含藏在 box64ec-prefix 里的 box64ec.dll）
          find box64/build -name "*.dll" -exec cp -a {} dist/ \;

          echo "===== dist 内容 ====="
          ls -lh dist/

          TAR_FILE="termux-glibc-box64-${VERSION}.tar.gz"
          tar -czvf "$TAR_FILE" -C dist .

          echo "===== 包内文件 ====="
          tar -tzvf "$TAR_FILE"

          echo "TAR_FILE=$TAR_FILE" >> $GITHUB_ENV
          echo "✅ 打包完成: $TAR_FILE"

          echo "${LATEST_COMMIT}" > "${LAST_DEV_COMMIT_FILE}"

      - name: 上传构建产物
        if: steps.check_build.outputs.skip_build == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: box64-${{ env.VERSION }}
          path: ${{ env.TAR_FILE }}
          retention-days: 7

      - name: 保存构建记录
        if: steps.check_build.outputs.skip_build == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: last-dev-box64-commit
          path: ${{ env.LAST_DEV_COMMIT_FILE }}
          retention-days: 90

      - name: 发布到 GitHub Release
        if: steps.check_build.outputs.skip_build == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: box64-${{ env.VERSION }}
          name: "Box64 ${{ env.VERSION }} (aarch64, Termux glibc, ARM64EC, 自动构建)"
          body: |
            ## 🚀 Box64 自动构建 - `${{ env.BOX64_VERSION }}`

            ### 📅 构建信息
            | 项目 | 信息 |
            |------|------|
            | **box64 版本** | `${{ env.BOX64_VERSION }}` |
            | **完整版本** | `${{ env.VERSION }}` |
            | **构建 ID** | `${{ env.BUILD_ID }}` |
            | **触发原因** | `${{ steps.check_build.outputs.arm_reason }}`（ARM 相关改动） |
            | **Commit** | `${{ env.LATEST_COMMIT_SHORT }}` |
            | **作者** | `${{ env.COMMIT_AUTHOR }}` |
            | **提交日期** | `${{ env.COMMIT_DATE }}` |
            | **提交消息** | `${{ env.COMMIT_MESSAGE }}` |
            | **构建时间** | `${{ env.BUILD_TIME }}` |
            | **平台** | `aarch64` |
            | **环境** | `Termux glibc` |
            | **交叉工具链** | `bylaws/llvm-mingw ${{ env.FEX_LLVMMINGW_TAG }}` |

            ### ⚙️ 编译选项
            ```cmake
            -DARM_DYNAREC=ON
            -DCMAKE_BUILD_TYPE=Release
            -DWINLATOR_GLIBC=ON
            -DARM64=ON
            -DSD8G2=ON
            -DARM64EC=ON
            ```
            ### 🔧 已应用补丁
            - `compilefix.patch`
            - `jmpbuf.patch`
            - `opt.patch`
            - `termux.patch`
            - `android-wx.patch`（Android W^X / mprotect 修复，**默认启用**）
            - **dfnone 修复**：编译期修复（不新增环境变量）

            ### 🅰️ Android W^X (mprotect) 修复
            - **症状**：`targetSdkVersion >= 29` 时，`untrusted_app` SELinux 域拒绝在 app 私有存储支撑的内存上做 `mprotect(PROT_EXEC)`，依赖该调用的程序（Wine / 加壳游戏 / 自带加载器的引擎）启动或加载阶段直接失败
            - **做法**：只剥离**传给宿主 `mprotect()`** 的 `PROT_EXEC`。box64 从不原生执行 guest 页（全部 JIT 到自己的 `MAP_ANONYMOUS` 代码缓存），所以宿主侧不需要该位；box64 自身的保护记账与 guest 可见页属性**保持不变**
            - **覆盖范围**：`my_mprotect()` 内全部 5 处宿主调用（4K 宿主页路径 1 处 + 16K 宿主页路径 4 处）
            - **关闭方式**：`export BOX64_ANDROID_WX=0`（临时回到上游行为）
            - **若出现异常**：先试 `BOX64_ANDROID_WX=0` 对比；ARM64EC / WOW64 模式属未充分验证场景


            ### 📥 安装方法
            ```bash
            mkdir -p /data/data/com.termux/files/usr/glibc/box64
            tar -xzf termux-glibc-box64-${{ env.VERSION }}.tar.gz -C /data/data/com.termux/files/usr/glibc/box64/

